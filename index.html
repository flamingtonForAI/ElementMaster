<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0b0910" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="五行师" />
    <title>五行师 · ElementMaster</title>
    <style>
      @font-face {
        font-family: 'FusionPixel';
        src: url('./fonts/fusion-pixel-12px.woff2') format('woff2');
        font-display: block;
      }
      html, body {
        margin: 0; height: 100%; background: #0b0910; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
      /* 手机竖屏时提示横屏 */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 20; background: #0b0910f2; color: #f4eee0;
        font: 16px/1.8 'FusionPixel', sans-serif; text-align: center;
        flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      }
      #rotate .icon { font-size: 40px; color: #ffd23f; }
      #rotate .tip { color: #8a8494; font-size: 12px; }
      #rotate button {
        margin-top: 8px; padding: 8px 18px; border: 1px solid #4a3f5c; background: #161220; color: #b8aec8;
        font: inherit; font-size: 12px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        body:not(.allow-portrait) #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="icon">⟳</div>
      <div>请把手机横过来玩</div>
      <div class="tip">如果画面没有转过来，请关闭系统的竖排方向锁定</div>
      <button id="rotate-skip">仍然竖屏继续</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
